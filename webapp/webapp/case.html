<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>Открытие кейса</title>
<link rel="stylesheet" href="/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="header">
  <div class="balance-bar">
    <div class="balance-item">
      <span class="stars">⭐</span>
      <span id="stars-balance">0</span>
    </div>
    <div class="balance-item">
      <span class="crystals">💎</span>
      <span id="crystals-balance">0</span>
    </div>
  </div>
</div>

<div class="case-header">
  <button class="back-btn" onclick="location.href='/'">←</button>
  <div class="case-title" id="case-title">Кейс</div>
</div>

<div class="roulette-wrap">
  <div class="roulette-arrow"></div>
  <div class="roulette" id="roulette">
    <div class="roulette-track" id="roulette-track"></div>
  </div>
</div>

<div class="case-actions">
  <button class="big-btn" id="open-btn" onclick="doOpen()">Крутить</button>
</div>

<div class="items-list-title">Что выпадает</div>
<div class="items-grid" id="items-grid"></div>

<div class="modal" id="modal">
  <div class="modal-content" id="modal-content"></div>
</div>

<div class="toast" id="toast"></div>

<script src="/app.js"></script>
<script>
  initPage('case');
</script>
</body>
</html>
