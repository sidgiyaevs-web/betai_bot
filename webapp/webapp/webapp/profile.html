<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>Профиль</title>
<link rel="stylesheet" href="/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="header">
  <div class="balance-bar">
    <div class="balance-item">
      <span class="stars">⭐</span>
      <span id="stars-balance">0</span>
    </div>
    <div class="balance-item">
      <span class="crystals">💎</span>
      <span id="crystals-balance">0</span>
    </div>
  </div>
</div>

<div class="case-header">
  <button class="back-btn" onclick="location.href='/'">←</button>
  <div class="case-title">Профиль</div>
</div>

<div class="profile-block">
  <div class="profile-name" id="profile-name">—</div>
  <div class="profile-stats">
    <div class="stat-row">
      <span>Открыто кейсов</span>
      <span id="stat-opened">0</span>
    </div>
    <div class="stat-row">
      <span>Потрачено</span>
      <span id="stat-spent">0 ⭐</span>
    </div>
    <div class="stat-row">
      <span>Выиграно</span>
      <span id="stat-won">0 ⭐</span>
    </div>
  </div>
</div>

<div class="items-list-title">Инвентарь</div>
<div class="inventory-grid" id="inventory-grid">
  <div class="loading">Загрузка...</div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn" onclick="location.href='/'">
    <span class="nav-icon">🎁</span>
    <span>Игры</span>
  </button>
  <button class="nav-btn active" onclick="location.href='/profile'">
    <span class="nav-icon">👤</span>
    <span>Профиль</span>
  </button>
  <button class="nav-btn" onclick="openTop()">
    <span class="nav-icon">🏆</span>
    <span>Топ</span>
  </button>
</nav>

<div class="modal" id="modal">
  <div class="modal-content" id="modal-content"></div>
</div>

<div class="toast" id="toast"></div>

<script src="/app.js"></script>
<script>
  initPage('profile');
</script>
</body>
</html>
